# ══════════════════════════════════════════════
#  SGD — Stack complète
#  Wazuh 4.14.4 + TheHive 5
# ══════════════════════════════════════════════

networks:
  frontend_net:
  backend_net:
  security_net:

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  # Wazuh 4.14.4
  wazuh_manager_data:
  wazuh_indexer_data:
  # TheHive
  thehive_data:
  thehive_index:
  cassandra_data:
  # Cortex
  cortex_data:
  elasticsearch_data:

services:

  # ──────────────────────────────────────────
  # 1. POSTGRESQL (Django)
  # ──────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: sgd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sgd_db}
      POSTGRES_USER: ${DB_USER:-sgd_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sgd_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # 2. REDIS
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sgd_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # 3. DJANGO
  # ──────────────────────────────────────────
  django:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sgd_django
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
      - ../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net
      - security_net
    ports:
      - "8000:8000"

  # ──────────────────────────────────────────
  # 4. NGINX
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sgd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/mediafiles:ro
    depends_on:
      - django
    networks:
      - frontend_net

  # ══════════════════════════════════════════
  #  WAZUH 4.14.4
  #  Les 3 composants nécessitent des certs SSL
  #  Génère-les d'abord avec :
  #  docker run --rm \
  #    -v $(pwd)/docker/wazuh/config/certs:/certificates \
  #    -v $(pwd)/docker/wazuh/config/certs.yml:/config/certs.yml \
  #    wazuh/wazuh-certs-generator:0.0.4
  # ══════════════════════════════════════════

  # ──────────────────────────────────────────
  # 5. WAZUH INDEXER (OpenSearch)
  # ──────────────────────────────────────────
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.4
    container_name: sgd_wazuh_indexer
    hostname: wazuh-indexer
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${WAZUH_INDEXER_PASSWORD:-Wazuh@Securite2026!}
      - bootstrap.memory_lock=true
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./wazuh/config/opensearch.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./wazuh/config/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./wazuh/config/certs/wazuh-indexer.pem:/usr/share/wazuh-indexer/config/certs/indexer.pem:ro
      - ./wazuh/config/certs/wazuh-indexer-key.pem:/usr/share/wazuh-indexer/config/certs/indexer-key.pem:ro
      - ./wazuh/config/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./wazuh/config/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
    networks:
      - security_net
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s

  # ──────────────────────────────────────────
  # 6. WAZUH MANAGER
  # ──────────────────────────────────────────
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.4
    container_name: sgd_wazuh_manager
    hostname: wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      INDEXER_URL: https://wazuh-indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-Wazuh@Securite2026!}
      FILEBEAT_SSL_VERIFICATION_MODE: none
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: ${WAZUH_API_USER:-wazuh-wui}
      API_PASSWORD: ${WAZUH_API_PASSWORD:-Wazuh@Securite2026!}
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - ./wazuh/config/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh/config/certs/wazuh-manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh/config/certs/wazuh-manager-key.pem:/etc/ssl/filebeat.key:ro
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    networks:
      - security_net
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - SYS_RESOURCE

  # ──────────────────────────────────────────
  # 7. WAZUH DASHBOARD
  # ──────────────────────────────────────────
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.4
    container_name: sgd_wazuh_dashboard
    hostname: wazuh-dashboard
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      # OPENSEARCH_HOSTS: '["https://wazuh-indexer:9200"]'
      INDEXER_URL: https://wazuh-indexer:9200
      INDEXER_USER: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-Wazuh@Securite2026!}
      WAZUH_API_URL: https://wazuh-manager:55000
      WAZUH_API_USER: ${WAZUH_API_USER:-wazuh-wui}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-Wazuh@Securite2026!}
      # Désactivation vérification SSL pour le dev
      WAZUH_API_CA: "false"
      OPEN_SEARCH_CA: "false"
      OPENSEARCH_SSL_VERIFICATION_MODE: none
    volumes:
      - ./wazuh/config/certs/wazuh-dashboard.pem:/usr/share/wazuh-dashboard/certs/dashboard.pem:ro
      - ./wazuh/config/certs/wazuh-dashboard-key.pem:/usr/share/wazuh-dashboard/certs/dashboard-key.pem:ro
      - ./wazuh/config/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-manager:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - security_net

  # ──────────────────────────────────────────
  # 8. THEHIVE
  # ──────────────────────────────────────────
  thehive:
    image: thehiveproject/thehive4:4.1.24
    container_name: sgd_thehive
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - JVM_OPTS=-Xms512m -Xmx1024m
      # Configuration de la base de données (Cassandra)
      - CASSANDRA_HOSTS=cassandra
      # Configuration de l'index (Elasticsearch)
      - ELASTICSEARCH_HOST=elasticsearch-cortex
      - ELASTICSEARCH_PORT=9200
    # Plus besoin de la section 'command', les variables d'environnement s'occupent de tout !
    volumes:
      - thehive_data:/data/db
      - thehive_index:/data/index
    depends_on:
      cassandra:
        condition: service_healthy
      elasticsearch-cortex:
        condition: service_healthy
    networks:
      - security_net


  # Conteneur temporaire pour fixer les permissions
    # Conteneur temporaire pour fixer proprement les permissions
  fix-permissions:
    image: busybox
    container_name: sgd_fix_permissions
    user: root
    command: >
      sh -c "
      chown -R 999:999 /data/thehive_db &&
      chown -R 999:999 /data/thehive_index &&
      chown -R 999:999 /data/cassandra_db &&
      chmod -R 750 /data/thehive_db /data/thehive_index /data/cassandra_db
      "
    volumes:
      - thehive_data:/data/thehive_db
      - thehive_index:/data/thehive_index
      - cassandra_data:/data/cassandra_db
    networks:
      - security_net


  cassandra:
    image: cassandra:3.11
    container_name: sgd_cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: thehive
      HEAP_NEWSIZE: 256M
      MAX_HEAP_SIZE: 1G
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - security_net
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep UN"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ──────────────────────────────────────────
  # 9. CORTEX
  # ──────────────────────────────────────────
  elasticsearch-cortex:
    image: elasticsearch:7.17.10
    container_name: sgd_elasticsearch_cortex
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - security_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  cortex:
    build:
      context: .
      dockerfile: cortex/Dockerfile
    container_name: sgd_cortex
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "9001:9001"
    command:
      - --no-config-secret
      - --no-config-es
      - --es-uri
      - http://elasticsearch-cortex:9200
      - --secret
      - "changeme_cortex_secret_key_min32chars_ok"
      - --job-directory
      - /tmp/cortex-jobs
      - --analyzer-url
      - https://download.thehive-project.org/analyzers.json
      - --responder-url
      - https://download.thehive-project.org/responders.json
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
      - config.file=/etc/cortex/application.conf
    volumes:
      - cortex_data:/data
      - /tmp/cortex-jobs:/tmp/cortex-jobs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./cortex/application.conf:/etc/cortex/application.conf
    depends_on:
      elasticsearch-cortex:
        condition: service_healthy
    networks:
      - security_net